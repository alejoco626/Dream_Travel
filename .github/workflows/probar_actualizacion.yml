name: Probar actualizacion

on:
  push:
    branches: ["arreglo-actualizacion-2"]

jobs:
  probar:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -t .
      - run: choco install innosetup -y --no-progress
      - name: Compilar la 1.0.18 nueva y el simulador de la 1.0.17
        run: |
          python poner_version.py v1.0.18
          pyinstaller --onedir --windowed --clean --noconfirm --name Calculadora_Dream_Travel --icon icono_calculadora.ico --add-data "icono_calculadora.ico;." --add-data "calculadora/web;calculadora/web" --collect-all webview --hidden-import win32clipboard calculadora_dream_travel.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.18" instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo" }
          Copy-Item Output\Calculadora_Dream_Travel_Setup.exe setup_nuevo.exe
          # Simulador: un .exe de un solo archivo llamado igual que la app, que abre el
          # instalador con el MISMO código que usa la 1.0.17 (lanzar_instalador) y se queda abierto.
          git show v1.0.17:calculadora/actualizador.py > actualizador_1017.py
          git show v1.0.17:calculadora/config.py > config.py
          (Get-Content actualizador_1017.py) -replace 'from \.config import', 'from config import' | Set-Content actualizador_1017.py
          "import sys, time`nimport actualizador_1017 as a`nruta = sys.argv[1]`na.lanzar_instalador(ruta, a.huella_de_archivo(ruta))`ntime.sleep(900)" | Set-Content simulador.py
          pyinstaller --onefile --windowed --noconfirm --name Calculadora_Dream_Travel --distpath sim --workpath simw --specpath sims simulador.py
          Get-ChildItem setup_nuevo.exe, sim\Calculadora_Dream_Travel.exe | Format-Table Name, Length
      - name: Probar 1.0.17 -> 1.0.18
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $fotos = New-Object System.Collections.ArrayList
          $carpeta = "$env:LOCALAPPDATA\Programs\Dream Travel Calculadora"
          $exe = "$carpeta\Calculadora_Dream_Travel.exe"
          function Capturar($nombre) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("$PWD\$nombre", [System.Drawing.Imaging.ImageFormat]::Png)
            [void]$fotos.Add($nombre)
          }
          function Procesos() { Get-Process | Where-Object { $_.ProcessName -match 'Calculadora' } }
          function Estado($momento) {
            Write-Host "===== $momento"
            Procesos | Select-Object Id, ProcessName, StartTime, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Host "carpeta _internal: $(Test-Path "$carpeta\_internal")  exe: $((Get-Item $exe -ErrorAction SilentlyContinue).Length) bytes"
          }
          # 1) Instalar la 1.0.17 publicada
          gh release download v1.0.17 -R $env:GITHUB_REPOSITORY -p Calculadora_Dream_Travel_Setup.exe -D v17
          $p = Start-Process v17\Calculadora_Dream_Travel_Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(120000)) { throw "No se instalo la 1.0.17" }
          Start-Sleep -Seconds 5; Procesos | Stop-Process -Force; Start-Sleep -Seconds 2
          Remove-Item "$env:LOCALAPPDATA\DreamTravel\*" -ErrorAction SilentlyContinue
          Estado "1.0.17 instalada"
          # 2) La 1.0.17 (simulada) abre el instalador nuevo y se queda abierta
          Copy-Item sim\Calculadora_Dream_Travel.exe $exe -Force
          $inicio = Get-Date
          Start-Process $exe -ArgumentList "`"$PWD\setup_nuevo.exe`""
          $ok = $false
          for ($i = 1; $i -le 24; $i++) {
            Start-Sleep -Seconds 5
            $setup = Get-Process | Where-Object { $_.ProcessName -match 'Setup' }
            if ($i -eq 2) { Estado "10 s despues de abrir el instalador"; Capturar "t10.png" }
            if (-not $setup -and (Test-Path "$carpeta\_internal")) { $ok = $true; Write-Host "El instalador termino a los $($i*5)s"; break }
          }
          Start-Sleep -Seconds 15
          Estado "despues de actualizar"
          Capturar "final.png"
          $version = Get-Content "$env:LOCALAPPDATA\DreamTravel\ultima_version.txt" -ErrorAction SilentlyContinue
          Write-Host "ULTIMA_VERSION: $version"
          if (Test-Path "$env:LOCALAPPDATA\DreamTravel\calculadora_error.log") { Write-Host "REGISTRO DE ERRORES:"; Get-Content "$env:LOCALAPPDATA\DreamTravel\calculadora_error.log" }
          $abierta = Procesos | Where-Object { $_.MainWindowTitle -eq "Calculadora de viajes D&T" }
          foreach ($n in $fotos) {
            Write-Host "BASE64-$n-INICIO"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$n")) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { Write-Host "B64:$_" }
            Write-Host "BASE64-$n-FIN"
          }
          Write-Host "RESULTADO instalo: $ok | se reabrio sola: $([bool]$abierta) | novedades de: $version"
          if (-not $ok -or -not $abierta -or $version -ne "1.0.18") { throw "La actualizacion no quedo bien" }
