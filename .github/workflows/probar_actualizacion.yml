name: Probar actualizacion

on:
  push:
    branches: ["arreglo-actualizacion"]

jobs:
  probar:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: choco install innosetup -y --no-progress
      - name: Compilar dos versiones con el arreglo (1.0.1 y 1.0.19)
        run: |
          foreach ($v in "1.0.1", "1.0.19") {
            git checkout -- calculadora/config.py
            python poner_version.py "v$v"
            pyinstaller --onedir --windowed --clean --noconfirm --name Calculadora_Dream_Travel --icon icono_calculadora.ico --add-data "icono_calculadora.ico;." --add-data "calculadora/web;calculadora/web" --collect-all webview --hidden-import win32clipboard calculadora_dream_travel.py
            if ($LASTEXITCODE -ne 0) { throw "pyinstaller fallo" }
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" instalador.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC fallo" }
            Copy-Item Output\Calculadora_Dream_Travel_Setup.exe "setup_$v.exe"
          }
          Get-ChildItem setup_*.exe | Format-Table Name, Length
      - name: Probar
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $fotos = New-Object System.Collections.ArrayList
          $carpeta = "$env:LOCALAPPDATA\Programs\Dream Travel Calculadora"
          $exe = "$carpeta\Calculadora_Dream_Travel.exe"
          function Capturar($nombre) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("$PWD\$nombre", [System.Drawing.Imaging.ImageFormat]::Png)
            [void]$fotos.Add($nombre)
          }
          function Procesos() { Get-Process | Where-Object { $_.ProcessName -match 'Calculadora' } }
          function Estado($momento) {
            Write-Host "===== $momento"
            Procesos | Select-Object Id, ProcessName, StartTime, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Host "carpeta _internal: $(Test-Path "$carpeta\_internal")  exe: $((Get-Item $exe -ErrorAction SilentlyContinue).Length) bytes"
          }
          function Instalar($archivo) {
            $p = Start-Process $archivo -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            if (-not $p.WaitForExit(120000)) { throw "La instalacion de $archivo no termino" }
            Start-Sleep -Seconds 5; Procesos | Stop-Process -Force; Start-Sleep -Seconds 2
          }
          function Enter() {
            $w = New-Object -ComObject wscript.shell
            $null = $w.AppActivate("Calculadora de viajes D&T"); Start-Sleep -Milliseconds 500
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          }
          $resultado = @{}

          # ---------- B: app con el arreglo (1.0.1) se actualiza sola a la 1.0.18 publicada
          Instalar "setup_1.0.1.exe"
          Remove-Item "$env:LOCALAPPDATA\DreamTravel\*" -ErrorAction SilentlyContinue
          Start-Process $exe; Start-Sleep -Seconds 15
          Estado "B: 1.0.1 abierta (debe ser 1 solo proceso)"
          Enter; Start-Sleep -Seconds 3; Enter
          $ok = $false
          for ($i = 1; $i -le 18; $i++) {
            Start-Sleep -Seconds 5
            $setup = Get-Process | Where-Object { $_.ProcessName -match 'Setup' }
            $tam = (Get-Item $exe -ErrorAction SilentlyContinue).Length
            if (-not $setup -and $tam -gt 15000000) { $ok = $true; Write-Host "B: instalador terminó a los $($i*5)s"; break }
          }
          Start-Sleep -Seconds 8
          Estado "B: despues de actualizar"
          Capturar "b_final.png"
          $resultado["B (la app nueva se cierra y deja instalar)"] = $ok
          Procesos | Stop-Process -Force; Start-Sleep -Seconds 2

          # ---------- A: PC con la 1.0.18 (un solo .exe) recibe el instalador nuevo con la app abierta
          Start-Process $exe; Start-Sleep -Seconds 15
          Estado "A: 1.0.18 abierta"
          $inicio = Get-Date
          $p = Start-Process "setup_1.0.19.exe" -ArgumentList "/SILENT","/NORESTART","/CLOSEAPPLICATIONS" -PassThru
          $termino = $p.WaitForExit(120000)
          Write-Host "A: instalador terminó: $termino en $([int]((Get-Date)-$inicio).TotalSeconds)s, codigo $($p.ExitCode)"
          Start-Sleep -Seconds 12
          Estado "A: despues de instalar la 1.0.19"
          Capturar "a_final.png"
          $resultado["A (la 1.0.18 abierta no bloquea el instalador nuevo)"] = ($termino -and $p.ExitCode -eq 0 -and (Test-Path "$carpeta\_internal"))
          if (Test-Path "$env:LOCALAPPDATA\DreamTravel\ultima_version.txt") { Write-Host "ULTIMA_VERSION:" (Get-Content "$env:LOCALAPPDATA\DreamTravel\ultima_version.txt") }
          if (Test-Path "$env:LOCALAPPDATA\DreamTravel\calculadora_error.log") { Write-Host "REGISTRO DE ERRORES:"; Get-Content "$env:LOCALAPPDATA\DreamTravel\calculadora_error.log" }

          # ---------- C: cerrar la ventana normalmente no deja procesos
          Procesos | Stop-Process -Force; Start-Sleep -Seconds 2
          $app = Start-Process $exe -PassThru; Start-Sleep -Seconds 12
          Procesos | ForEach-Object { $_.CloseMainWindow() | Out-Null }
          Start-Sleep -Seconds 6
          Estado "C: despues de cerrar la ventana"
          $resultado["C (al cerrar no queda nada abierto)"] = -not (Procesos)

          foreach ($n in $fotos) {
            Write-Host "BASE64-$n-INICIO"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$n")) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { Write-Host "B64:$_" }
            Write-Host "BASE64-$n-FIN"
          }
          Write-Host "===== RESULTADOS"
          $resultado.GetEnumerator() | ForEach-Object { Write-Host "RESULTADO $($_.Key): $($_.Value)" }
          if ($resultado.Values -contains $false) { throw "Alguna prueba fallo" }
