name: Revisar en Windows

on:
  push:
    branches: ["diseno-web"]

jobs:
  revisar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -t . -v
      - run: python poner_version.py v1.0.17
      - name: Compilar
        run: >
          pyinstaller --onefile --windowed --clean
          --name Calculadora_Dream_Travel
          --icon icono_calculadora.ico
          --add-data "icono_calculadora.ico;."
          --add-data "calculadora/web;calculadora/web"
          --collect-all webview
          --hidden-import win32clipboard
          calculadora_dream_travel.py
      - name: Prueba de arranque
        run: |
          $env:CALCULADORA_PRUEBA_ARRANQUE = "1"
          $registro = Join-Path $env:LOCALAPPDATA "DreamTravel\calculadora_error.log"
          Remove-Item $registro -ErrorAction SilentlyContinue
          $inicio = Get-Date
          $proceso = Start-Process dist\Calculadora_Dream_Travel.exe -PassThru
          if (-not $proceso.WaitForExit(90000)) { $proceso.Kill(); throw "El programa no cerro a tiempo" }
          Write-Host "Tardo $(((Get-Date) - $inicio).TotalSeconds) s"
          if (Test-Path $registro) { Get-Content $registro; throw "El programa fallo al abrir" }
          if ($proceso.ExitCode -ne 0) { throw "Codigo de salida $($proceso.ExitCode)" }
          Get-Item dist\Calculadora_Dream_Travel.exe | Select-Object Name, Length
      - name: Abrir, escribir y capturar la pantalla
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Capturar($nombre) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("$PWD\$nombre", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $p = Start-Process dist\Calculadora_Dream_Travel.exe -PassThru
          Start-Sleep -Seconds 15
          Capturar "w1_inicio.png"
          $wshell = New-Object -ComObject wscript.shell
          $null = $wshell.AppActivate($p.Id)
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("2{ENTER}1{ENTER}1{ENTER}1000{ENTER}1600{ENTER}1700{ENTER}100{ENTER}90{ENTER}80{ENTER}")
          Start-Sleep -Seconds 3
          Capturar "w2_presupuesto.png"
          [System.Windows.Forms.SendKeys]::SendWait("^{ENTER}")
          Start-Sleep -Seconds 2
          Capturar "w3_calcular.png"
          Stop-Process -Id $p.Id -Force
          $registro = Join-Path $env:LOCALAPPDATA "DreamTravel\calculadora_error.log"
          if (Test-Path $registro) { Write-Host "REGISTRO DE ERRORES:"; Get-Content $registro }
          foreach ($n in "w1_inicio.png","w2_presupuesto.png","w3_calcular.png") {
            Write-Host "BASE64-$n-INICIO"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$n")) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { Write-Host "B64:$_" }
            Write-Host "BASE64-$n-FIN"
          }
