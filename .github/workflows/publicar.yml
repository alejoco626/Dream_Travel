name: Publicar version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    env:
      ETIQUETA: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Poner el numero de version en el programa
        run: python poner_version.py "$env:ETIQUETA"

      - name: Compilar el programa
        run: >
          pyinstaller --onefile --windowed --clean
          --name Calculadora_Dream_Travel
          --icon icono_calculadora.ico
          --add-data "icono_calculadora.ico;."
          --add-data "Logo_Letras_Blanco.png;."
          --hidden-import win32clipboard
          calculadora_dream_travel.py

      - name: Comprobar que el programa abre
        run: |
          $env:CALCULADORA_PRUEBA_ARRANQUE = "1"
          $registro = Join-Path $env:LOCALAPPDATA "DreamTravel\calculadora_error.log"
          Remove-Item $registro -ErrorAction SilentlyContinue
          $proceso = Start-Process dist\Calculadora_Dream_Travel.exe -PassThru
          if (-not $proceso.WaitForExit(60000)) { $proceso.Kill(); throw "El programa no cerro a tiempo" }
          if (Test-Path $registro) { Get-Content $registro; throw "El programa fallo al abrir" }
          if ($proceso.ExitCode -ne 0) { throw "Codigo de salida $($proceso.ExitCode)" }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear el instalador
        run: |
          $version = $env:ETIQUETA.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" instalador.iss

      - name: Publicar la version en GitHub
        run: |
          $archivo = "Output/Calculadora_Dream_Travel_Setup.exe"
          gh release view "$env:ETIQUETA" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:ETIQUETA" $archivo --clobber
          } else {
            gh release create "$env:ETIQUETA" $archivo --title "Version $env:ETIQUETA" --generate-notes
          }
