name: Captura en Windows

on:
  push:
    branches: ["captura-windows"]

jobs:
  captura:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --windowed --clean
          --name Calculadora_Dream_Travel
          --icon icono_calculadora.ico
          --add-data "icono_calculadora.ico;."
          --add-data "Logo_Letras_Blanco.png;."
          --hidden-import win32clipboard
          calculadora_dream_travel.py
      - name: Abrir y capturar la pantalla
        run: |
          $p = Start-Process dist\Calculadora_Dream_Travel.exe -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($img)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$PWD\pantalla.png")
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\dist\Calculadora_Dream_Travel.exe")
          $ico.ToBitmap().Save("$PWD\icono_exe.png")
          Stop-Process -Id $p.Id -Force
          $chico = New-Object System.Drawing.Bitmap 480, 260
          $g2 = [System.Drawing.Graphics]::FromImage($chico)
          $g2.DrawImage($img, (New-Object System.Drawing.Rectangle 0,0,480,260), (New-Object System.Drawing.Rectangle 0,0,480,260), [System.Drawing.GraphicsUnit]::Pixel)
          $chico.Save("$PWD\esquina.png")
          $barra = New-Object System.Drawing.Bitmap 400, 60
          $g3 = [System.Drawing.Graphics]::FromImage($barra)
          $g3.DrawImage($img, (New-Object System.Drawing.Rectangle 0,0,400,60), (New-Object System.Drawing.Rectangle 0,($b.Height-60),400,60), [System.Drawing.GraphicsUnit]::Pixel)
          $barra.Save("$PWD\barra.png")
          foreach ($n in "esquina.png","barra.png","icono_exe.png") { Write-Host "BASE64-$n-INICIO"; [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$n")) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { Write-Host "B64:$_" }; Write-Host "BASE64-$n-FIN" }
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            pantalla.png
            icono_exe.png
